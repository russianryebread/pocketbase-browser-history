<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .config-section {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px 0;
    }
    button:hover {
      background: #45a049;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <h3>History to PocketBase</h3>

  <div class="config-section">
    <label for="pocketbaseUrl">PocketBase URL:</label>
    <input type="url" id="pocketbaseUrl" placeholder="https://your-pocketbase.example">
  </div>

  <div class="config-section">
    <label for="userEmail">PocketBase account email:</label>
    <input type="email" id="userEmail" placeholder="user@example.com">
  </div>

  <div class="config-section">
    <label for="password">Password:</label>
    <input type="password" id="password" autocomplete="current-password">
  </div>

  <button id="saveConfig">Sign in and save</button>
  <button id="syncNow">Sync</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
